<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button.flex-\\[2\\]');
            const prevBtn = document.querySelector('button.flex-1');
            const skipBtn = document.querySelector('header button');

            // Feedback on click
            const addFeedback = (el) => {
                el.addEventListener('mousedown', () => el.classList.add('scale-95'));
                el.addEventListener('mouseup', () => el.classList.remove('scale-95'));
                el.addEventListener('mouseleave', () => el.classList.remove('scale-95'));
            };

            [nextBtn, prevBtn, skipBtn].forEach(addFeedback);

            // Subtle parallax on card
            const card = document.querySelector('.relative.bg-white');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            
            // Reset rotation when mouse leaves window
            document.addEventListener('mouseleave', () => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        });
    </script>
